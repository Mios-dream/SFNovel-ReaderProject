name: Publish Release
run-name: Publish Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  OCR_MODEL_URL: https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/rec/PP-OCRv6_rec_small.onnx
  OCR_MODEL_SHA256: 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884

jobs:
  desktop:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Download OCR recognition model
        shell: pwsh
        run: |
          $modelPath = "src-tauri/resources/ocr-models/PP-OCRv6_rec_small.onnx"
          New-Item -ItemType Directory -Force (Split-Path -Parent $modelPath) | Out-Null
          Invoke-WebRequest -Uri $env:OCR_MODEL_URL -OutFile $modelPath
          $actualHash = (Get-FileHash -Algorithm SHA256 $modelPath).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:OCR_MODEL_SHA256) {
            throw "OCR recognition model checksum mismatch: $actualHash"
          }

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build and verify OCR worker
        shell: pwsh
        run: |
          npm run ocr:build
          $workerPath = "src-tauri/ocr-worker/ocr_worker.exe"
          if (-not (Test-Path -LiteralPath $workerPath -PathType Leaf)) {
            throw "OCR worker was not created: $workerPath"
          }
          if ((Get-Item -LiteralPath $workerPath).Length -eq 0) {
            throw "OCR worker is empty: $workerPath"
          }

      - name: Read release template
        id: template
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            cat .github/release_template.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload Windows bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Novel Flow ${{ github.ref_name }}
          releaseBody: ${{ steps.template.outputs.body }}
          releaseDraft: false
          prerelease: false

  android:
    name: Build Android APK
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Download OCR recognition model
        shell: bash
        run: |
          model_path=src-tauri/resources/ocr-models/PP-OCRv6_rec_small.onnx
          mkdir -p "$(dirname "$model_path")"
          curl --fail --location --retry 3 --retry-all-errors --output "$model_path" "$OCR_MODEL_URL"
          echo "$OCR_MODEL_SHA256  $model_path" | sha256sum --check --status

      - name: Read release template
        id: template
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            cat .github/release_template.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/sf-novel-flow-release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=sf-novel-flow-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=sf-novel-flow
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF

      - name: Build and upload Android APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: android
          args: --apk --target aarch64
          tagName: ${{ github.ref_name }}
          releaseName: Novel Flow ${{ github.ref_name }}
          releaseBody: ${{ steps.template.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f src-tauri/gen/android/keystore.properties src-tauri/gen/android/sf-novel-flow-release.jks
