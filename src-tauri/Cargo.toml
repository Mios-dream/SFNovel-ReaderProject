[package]
name = "sf-novel-flow"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sf_novel_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
uuid = { version = "1.29.0", features = ["v4"] }
md-5 = "0.11.0"
urlencoding = "2.1.3"
tokio = { version = "1.54.1", features = ["sync", "time"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
